[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar_cv"
version = "0.1.0"
description = "Coefficient of variation and crop area from NISAR GCOV time series."
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are managed in environment.yml (gdal comes from conda-forge)
dependencies = []

[project.scripts]
nisar_cv = "nisar_cv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
