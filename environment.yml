name: nisar-cv
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.12
  - pip>=26.2.2
  # For running
  - asf_search=14.0
  - gdal=3.13
  - h5py=3.16
  - numpy=2.5
  - boto3=1.43
  # For packaging, and testing
  - pytest=9.1
  - pytest-cov=7.1
  # For quick-look plots during development
  - matplotlib=3.11
  - pip:
    - -e .
    #for linting and type checking
    - ruff==0.17.0
    - mypy==2.4.0
